<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask MedPin AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #545E72">Good morning,</span><span style="font-size: 28px; font-weight: 800">Priya</span></div>
  <div style="position: relative; height: 212px; border-radius: 20px; overflow: hidden; background: #003399">
    <img src="/_blob/022c04e18fedbc18831a94fe64e734d1" alt="" style="position: absolute; top: 0; right: 0; width: 212px; height: 212px; object-fit: cover">
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, #003399 40%, rgba(0,51,153,0.55) 62%, rgba(0,51,153,0) 85%)"></div>
  </div>
</div>
<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="ai-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>

  <div style="display: flex; align-items: flex-start; gap: 8px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
      <h2 id="ai-h" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 1.25; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#003399" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
        Ask MedPin AI
      </h2>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Tell us how you feel or share a report. We'll explain it and point you to the right doctor.</span>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div style="position: relative">
    <label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Describe your symptoms or ask a question</label>
    <textarea id="ask" placeholder="E.g. I've had a headache and fever for 2 days" style="width: 100%; height: 112px; box-sizing: border-box; padding: 14px 16px 56px; border: 2px solid #003399; border-radius: 16px; background: #FFFFFF; font-size: 16px; line-height: 1.5; resize: none; outline: none"></textarea>
    <div style="position: absolute; right: 8px; bottom: 8px; display: flex; gap: 8px">
      <button aria-label="Speak your symptoms" style="height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: #EBF1FB; color: #003399; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        Speak
      </button>
      <button aria-label="Send" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #003399; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column">
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: {{ o.border }}; color: #111827">
        <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #EBF1FB; color: #003399; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{ o.isRx }}" hint-placeholder-val="{{ true }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>
          </sc-if>
          <sc-if value="{{ o.isLab }}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"></path><path d="M7 15h10"></path></svg>
          </sc-if>
          <sc-if value="{{ o.isDoc }}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v5a5 5 0 0 0 10 0V3"></path><path d="M10 13v2a5 5 0 0 0 10 0v-1"></path><circle cx="20" cy="12" r="2"></circle></svg>
          </sc-if>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{ o.title }}</span>
          <span style="font-size: 13px; line-height: 1.4; color: #545E72">{{ o.sub }}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">People often ask</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button style="height: 40px; padding: 0 14px; border: 1px solid #D5DBE5; border-radius: 999px; background: #FFFFFF; color: #111827; font-size: 14px; font-weight: 600">Is HbA1c 7.2% high?</button>
      <button style="height: 40px; padding: 0 14px; border: 1px solid #D5DBE5; border-radius: 999px; background: #FFFFFF; color: #111827; font-size: 14px; font-weight: 600">I missed a dose, what now?</button>
    </div>
  </div>

  <p style="margin: 0; padding-top: 14px; border-top: 1px solid #E5E9F0; font-size: 13px; line-height: 1.45; color: #69738A">MedPin AI gives guidance, not a diagnosis. In an emergency, <a href="tel:+913340001234" style="font-weight: 700; color: #B91C1C">call your clinic</a>.</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        { isRx: true, isLab: false, isDoc: false, title: 'Upload a prescription', sub: 'Photo or PDF. We add the medicines to your reminders.' },
        { isRx: false, isLab: true, isDoc: false, title: 'Upload a test report', sub: 'We flag anything out of range and explain it simply.' },
        { isRx: false, isLab: false, isDoc: true, title: 'Find the right doctor', sub: 'Describe your symptoms and we suggest a specialist.' }
      ].map(function (o, i) { o.border = i === 0 ? '0' : '1px solid #E5E9F0'; return o; })
    };
  }
}
</script>
</body>
</html>
