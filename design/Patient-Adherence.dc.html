<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adherence by doctor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #545E72">Good morning,</span><span style="font-size: 28px; font-weight: 800">Priya</span></div>
<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="ad-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>
  <div style="display: flex; align-items: flex-start; gap: 8px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
      <h2 id="ad-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Taking your medicines</h2>
      <span style="font-size: 14px; color: #545E72">Last 30 days · <strong style="color: #111827; font-variant-numeric: tabular-nums">86%</strong> of doses taken</span>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <sc-for list="{{ docs }}" as="d" hint-placeholder-count="3">
    <div style="border: 1px solid #E5E9F0; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{ d.name }}</span>
          <span style="font-size: 13px; color: #545E72">{{ d.dept }}</span>
        </span>
        <span style="font-size: {{ d.pctSize }}; font-weight: 800; font-variant-numeric: tabular-nums; color: {{ d.pctColor }}">{{ d.pct }}</span>
      </div>
      <sc-if value="{{ d.hasBar }}" hint-placeholder-val="{{ true }}">
        <div style="height: 6px; border-radius: 999px; background: #E5E9F0; overflow: hidden"><div style="height: 6px; border-radius: 999px; width: {{ d.width }}; background: {{ d.barColor }}"></div></div>
      </sc-if>
      <span style="font-size: 13px; line-height: 1.45; color: #545E72">{{ d.meds }}</span>
    </div>
  </sc-for>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #FEF6E7">
    <span style="flex-grow: 1; font-size: 14px; line-height: 1.45"><strong style="color: #B45309">Most misses are in the evening.</strong> A reminder at 8:30 PM can help.</span>
    <button style="height: 40px; padding: 0 14px; flex-shrink: 0; border: 0; border-radius: 12px; background: #FFFFFF; color: #003399; font-size: 14px; font-weight: 700">Set</button>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      docs: [
        { name: 'Dr. Arjun Sen', dept: 'Diabetes · City Care', pct: '82%', pctSize: '20px', pctColor: '#B45309', hasBar: true, width: '82%', barColor: '#B45309', meds: 'Metformin 78% · Glimepiride started today · Vitamin D3 100%' },
        { name: 'Dr. Rina Mitra', dept: 'Heart · City Care', pct: '91%', pctSize: '20px', pctColor: '#076B3C', hasBar: true, width: '91%', barColor: '#003399', meds: 'Atorvastatin 91%' },
        { name: 'Dr. Nandita Gupta', dept: 'Gynaecology · Apollo Clinic', pct: 'Not tracked', pctSize: '14px', pctColor: '#69738A', hasBar: false, width: '0', barColor: '#003399', meds: 'Myo-inositol · turn on reminders to start tracking' }
      ]
    };
  }
}
</script>
</body>
</html>
