<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appointments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 1600px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; background: #F7F9FC; display: flex; align-items: center; gap: 4px">
  <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Appointments</h1>
</header>

<main style="padding: 8px 20px 32px; display: flex; flex-direction: column; gap: 16px">

  <!-- Waiting for a time: always first -->
  <section aria-labelledby="wait-h" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: center; gap: 10px">
          <h2 id="wait-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Waiting for a time</h2>
          <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #FEF6E7; color: #B45309; font-size: 12px; font-weight: 700; display: flex; align-items: center">3</span>
        </div>
        <span style="font-size: 14px; color: #545E72">Requests with no slot yet, oldest first</span>
      </div>
      <a href="#" style="font-size: 14px; font-weight: 600; padding-top: 3px">View all</a>
    </div>
    <sc-for list="{{ requests }}" as="r" hint-placeholder-count="2">
      <article style="padding: 16px 0; border-top: 1px solid #E5E9F0; display: flex; flex-direction: column; gap: 12px">
        <a href="#" style="display: flex; align-items: center; gap: 12px; color: #111827">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; background: #EBF1FB; color: #003399; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ r.initials }}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 16px; font-weight: 600">{{ r.name }}</span>
            <span style="font-size: 13px; color: #69738A">{{ r.when }}</span>
          </span>
        </a>
        <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #111827">{{ r.reason }}</p>
        <div style="padding: 10px 14px; border-radius: 12px; background: #F7F9FC; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #545E72">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>Requested: <strong style="font-weight: 600; color: #111827">{{ r.pref }}</strong></span>
        </div>
        <div style="display: flex; gap: 8px">
          <button style="flex-grow: 1; height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: #EBF1FB; color: #003399; font-size: 15px; font-weight: 600; cursor: pointer">Assign time</button>
          <button style="height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: #545E72; font-size: 15px; font-weight: 600; cursor: pointer">Decline</button>
        </div>
      </article>
    </sc-for>
  </section>

  <div role="tablist" aria-label="Range" style="margin-top: 8px; padding: 4px; border-radius: 16px; background: #F1F4F9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <button role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72; cursor: pointer">Today</button>
    <button role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); font-size: 15px; font-weight: 600; color: #111827; cursor: pointer">Upcoming</button>
    <button role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72; cursor: pointer">Past</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
      <div style="padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5E9F0; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{ s.n }}</span>
        <span style="font-size: 14px; line-height: 1.35; color: #545E72">{{ s.label }}</span>
      </div>
    </sc-for>
  </div>

  <sc-for list="{{ days }}" as="d" hint-placeholder-count="2">
    <section aria-label="{{ d.label }}" style="padding-top: 8px; display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">{{ d.label }}</h3>
      <div style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 4px 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column">
        <sc-for list="{{ d.rows }}" as="a" hint-placeholder-count="3">
          <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-top: {{ a.divider }}">
            <span style="width: 68px; flex-shrink: 0; padding-top: 1px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{ a.time }}</span>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.name }}</span>
              <span style="font-size: 14px; color: #545E72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.where }}</span>
              <span style="align-self: flex-start; margin-top: 2px; height: 22px; padding: 0 8px; border-radius: 999px; background: {{ a.bg }}; color: {{ a.fg }}; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{ a.status }}</span>
            </span>
            <button aria-label="{{ a.manageLabel }}" style="flex-shrink: 0; height: 48px; margin-top: -12px; padding: 0 4px 0 8px; border: 0; background: transparent; color: #003399; font-size: 15px; font-weight: 600; cursor: pointer">Manage</button>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>

  <button aria-expanded="false" style="margin-top: 8px; min-height: 56px; box-sizing: border-box; padding: 0 20px; border: 1px solid #E5E9F0; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; color: #545E72; cursor: pointer">
    Declined requests (2)
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    var ST = {
      'Checked in': { bg: '#EBF1FB', fg: '#003399' },
      'Confirmed': { bg: '#E7F5EE', fg: '#076B3C' },
      'Booked': { bg: '#F1F4F9', fg: '#545E72' }
    };
    function rows(list) {
      return list.map(function (r, i) {
        var s = ST[r[3]];
        return { time: r[0], name: r[1], where: r[2], status: r[3], bg: s.bg, fg: s.fg,
          divider: i === 0 ? '0' : '1px solid #E5E9F0',
          manageLabel: 'Manage appointment for ' + r[1] + ' at ' + r[0] };
      });
    }
    return {
      requests: [
        { initials: 'SM', name: 'Sujit Mondal', when: 'Asked yesterday, 6:40 PM', reason: 'New consultation: fever and body ache for 3 days', pref: 'Any morning this week' },
        { initials: 'FI', name: 'Farhana Islam', when: 'Asked today, 8:15 AM', reason: 'Follow-up on her haemoglobin report', pref: 'Thu or Fri, after 5 PM' }
      ],
      stats: [
        { n: '18', label: 'Booked' },
        { n: '3', label: 'Waiting' },
        { n: '2', label: 'Freed up' }
      ],
      days: [
        { label: 'Today · Tue 29 Sep', rows: rows([
          ['9:30 AM', 'Rahul Das', 'Dr. Sen · Salt Lake', 'Checked in'],
          ['10:00 AM', 'Aisha Khan', 'Dr. Sen · Salt Lake', 'Confirmed'],
          ['11:30 AM', 'Moumita Roy', 'Dr. Mitra · Salt Lake', 'Booked']
        ]) },
        { label: 'Wed 30 Sep', rows: rows([
          ['10:00 AM', 'Debasish Bose', 'Dr. Sen · New Town', 'Confirmed'],
          ['11:20 AM', 'Amit Pal', 'Dr. Sen · New Town', 'Booked']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
