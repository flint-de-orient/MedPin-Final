<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add to cart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 28px; font-weight: 800">Medicines</span><span style="font-size: 14px; color: #545E72">5 running · from 3 doctors</span></div>
<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="ac-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 20px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>
  <div style="display: flex; align-items: flex-start; gap: 8px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
      <h2 id="ac-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Atorvastatin 10 mg</h2>
      <span style="font-size: 14px; color: #545E72">Strip of 10 tablets · you take 1 a day</span>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 600">How much do you need?</span>
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: {{ o.bg }}; border: {{ o.border }}; cursor: pointer">
        <input type="radio" name="qty" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; box-sizing: border-box; border: {{ o.ring }}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 999px; background: #003399"></span></sc-if>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{ o.title }}</span>
          <span style="font-size: 13px; color: #545E72">{{ o.sub }}</span>
        </span>
        <sc-if value="{{ o.tag }}" hint-placeholder-val="{{ false }}">
          <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #003399; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{ o.tag }}</span>
        </sc-if>
      </label>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 600">Or pick strips</span>
      <span style="font-size: 13px; color: #545E72">Covers till 1 Nov with what you have</span>
    </span>
    <div role="group" aria-label="Number of strips" style="display: flex; align-items: center; border: 1px solid #D5DBE5; border-radius: 12px; overflow: hidden">
      <button aria-label="One less strip" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; color: #003399; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <span style="width: 40px; text-align: center; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">2</span>
      <button aria-label="One more strip" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; color: #003399; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>

  <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #69738A">Final price depends on the pharmacy you pick at checkout.</p>

  <button style="height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24)">Add 2 strips to cart</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function o(title, sub, on, tag) {
      return { title: title, sub: sub, on: on, tag: tag || '', bg: on ? '#EBF1FB' : '#FFFFFF', border: on ? '1.5px solid #003399' : '1px solid #D5DBE5', ring: on ? '2px solid #003399' : '2px solid #D5DBE5' };
    }
    return {
      options: [
        o('Till my next visit', '2 strips · lasts till 1 Nov', true, 'Suggested'),
        o('1 month', '3 strips · 30 days', false),
        o('3 months', '9 strips · 90 days', false)
      ]
    };
  }
}
</script>
</body>
</html>
