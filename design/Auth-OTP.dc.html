<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative; line-height: 1.4">

<header style="height: 64px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; background: #F7F9FC">
  <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
</header>

<main style="padding: 8px 20px 24px; display: flex; flex-direction: column">
  <h1 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em">Enter the 6-digit code</h1>
  <p style="margin: 8px 0 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 16px; line-height: 1.5; color: #545E72">
    <span style="font-variant-numeric: tabular-nums">Sent to +91 98765 •••10</span>
    <a href="#" style="font-size: 16px; font-weight: 600">Change</a>
  </p>

  <form action="#" style="margin: 32px 0 0; display: flex; flex-direction: column">
    <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">One-time code</legend>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0; border: 1px solid #D5DBE5; border-radius: 12px; background: #FFFFFF; outline: none; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">
        <input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0; border: 1px solid #D5DBE5; border-radius: 12px; background: #FFFFFF; outline: none; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">
        <input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="2" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0; border: 1px solid #D5DBE5; border-radius: 12px; background: #FFFFFF; outline: none; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">
        <span style="position: relative; display: block">
          <input aria-label="Digit 4" inputmode="numeric" maxlength="1" value="" autofocus style="width: 100%; height: 56px; box-sizing: border-box; padding: 0; border: 2px solid #003399; border-radius: 12px; background: #FFFFFF; outline: none; box-shadow: 0 0 0 3px #EBF1FB; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: 16px; width: 2px; height: 24px; margin-left: -1px; border-radius: 999px; background: #003399"></span>
        </span>
        <input aria-label="Digit 5" inputmode="numeric" maxlength="1" value="" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0; border: 1px solid #D5DBE5; border-radius: 12px; background: #FFFFFF; outline: none; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">
        <input aria-label="Digit 6" inputmode="numeric" maxlength="1" value="" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0; border: 1px solid #D5DBE5; border-radius: 12px; background: #FFFFFF; outline: none; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">
      </div>
    </fieldset>

    <p style="margin: 20px 0 0; font-size: 14px; color: #545E72" aria-live="polite">Resend code in <span style="font-weight: 600; color: #111827; font-variant-numeric: tabular-nums">0:24</span></p>

    <button type="submit" style="margin-top: 32px; height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24); cursor: pointer">Verify</button>
  </form>
</main>
</div>
</x-dc>
