<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Consultation · set dosage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="background: #FFFFFF; border-bottom: 1px solid #E5E9F0; height: 64px; padding: 0 16px; display: flex; align-items: center; font-size: 20px; font-weight: 700">Consultation</div>
<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="d-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>

  <div style="display: flex; align-items: flex-start; gap: 8px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <h2 id="d-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Glimepiride</h2>
      <span style="font-size: 14px; color: #545E72">Tablet · sulfonylurea · suggested for poorly controlled diabetes</span>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #FEF6E7; display: flex; gap: 8px; font-size: 13px; line-height: 1.45; color: #111827">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
    <span>Priya has a sulfa drug allergy. Confirm it's safe, or pick Vildagliptin instead.</span>
  </p>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 600">Strength</span>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{ strength }}" as="o" hint-placeholder-count="3">
        <button aria-pressed="{{ o.on }}" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{ o.bg }}; color: {{ o.fg }}; border: {{ o.border }}">{{ o.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600">When <span style="font-weight: 700; color: #003399; font-variant-numeric: tabular-nums">1-0-0</span></span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ times }}" as="t" hint-placeholder-count="3">
        <button aria-pressed="{{ t.on }}" style="height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{ t.bg }}; color: {{ t.fg }}; border: {{ t.border }}">
          <span style="font-size: 15px; font-weight: 700">{{ t.label }}</span>
          <span style="font-size: 12px; font-variant-numeric: tabular-nums">{{ t.count }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 600">With food</span>
    <div role="group" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; background: #F1F4F9; border-radius: 16px">
      <button aria-pressed="true" style="height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.08); font-size: 15px; font-weight: 600; color: #111827">Before</button>
      <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72">After</button>
      <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72">With</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 600">Duration</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ duration }}" as="o" hint-placeholder-count="5">
        <button aria-pressed="{{ o.on }}" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{ o.bg }}; color: {{ o.fg }}; border: {{ o.border }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #69738A">Quantity: 30 tablets</span>
  </div>

  <button style="height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24)">Add to prescription</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function chip(label, on) { return { label: label, on: on, bg: on ? '#003399' : '#FFFFFF', fg: on ? '#FFFFFF' : '#545E72', border: on ? '1px solid #003399' : '1px solid #D5DBE5' }; }
    function time(label, on) { return { label: label, on: on, count: on ? '1 tablet' : 'None', bg: on ? '#EBF1FB' : '#FFFFFF', fg: on ? '#003399' : '#545E72', border: on ? '1.5px solid #003399' : '1px solid #D5DBE5' }; }
    return {
      strength: [chip('1 mg', true), chip('2 mg', false), chip('4 mg', false)],
      times: [time('Morning', true), time('Afternoon', false), time('Night', false)],
      duration: [chip('7 days', false), chip('15 days', false), chip('30 days', true), chip('90 days', false), chip('Custom', false)]
    };
  }
}
</script>
</body>
</html>
