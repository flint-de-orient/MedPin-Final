<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add someone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
input::placeholder{color:#69738A}
</style>
</helmet>
<div style="width: 390px; height: 1304px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #F7F9FC">
  <button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Add someone</h1>
</header>

<form style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 24px; margin: 0">

  <!-- Role picker -->
  <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
    <legend style="padding: 0 0 8px; font-size: 14px; line-height: 1.45; font-weight: 600">Role</legend>
    <div role="radiogroup" aria-label="Role" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ roles }}" as="r" hint-placeholder-count="7">
        <button type="button" role="radio" aria-checked="{{ r.checked }}" style="height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: {{ r.border }}; background: {{ r.bg }}; color: {{ r.fg }}; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">{{ r.label }}</button>
      </sc-for>
    </div>
  </fieldset>

  <!-- Name -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="f-name" style="font-size: 14px; line-height: 1.45; font-weight: 600">Full name</label>
    <input id="f-name" type="text" value="Dr. Ananya Basu" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; outline: none">
  </div>

  <!-- Phone, verified -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="f-phone" style="font-size: 14px; line-height: 1.45; font-weight: 600">Phone</label>
    <div style="position: relative; display: flex; align-items: center">
      <input id="f-phone" type="tel" value="+91 98300 45127" aria-describedby="f-phone-h" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 112px 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; font-variant-numeric: tabular-nums; outline: none">
      <span style="position: absolute; right: 16px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #076B3C">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        Verified
      </span>
    </div>
    <span id="f-phone-h" style="font-size: 13px; line-height: 1.4; color: #69738A">OTP confirmed just now</span>
  </div>

  <!-- Doctor-only fields -->
  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; line-height: 1.35; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">Doctor details</span>
      <span style="font-size: 13px; line-height: 1.4; color: #69738A">Printed on this doctor's prescriptions</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-qual" style="font-size: 14px; line-height: 1.45; font-weight: 600">Qualifications</label>
      <input id="f-qual" type="text" value="MBBS, DNB (Endocrinology)" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; outline: none">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-reg" style="font-size: 14px; line-height: 1.45; font-weight: 600">Registration number</label>
      <input id="f-reg" type="text" value="WBMC 71842" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; font-variant-numeric: tabular-nums; outline: none">
    </div>
  </div>

  <!-- Department -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="f-dept" style="font-size: 14px; line-height: 1.45; font-weight: 600">Department</label>
    <div style="position: relative; display: flex; align-items: center">
      <select id="f-dept" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 48px 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; appearance: none; -webkit-appearance: none; outline: none">
        <option selected>Endocrinology</option>
        <option>Diabetology</option>
        <option>Cardiology</option>
        <option>General medicine</option>
        <option>Gynaecology</option>
        <option>Nephrology</option>
      </select>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
    </div>
  </div>

  <!-- Locations -->
  <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
    <legend style="padding: 0 0 8px; font-size: 14px; line-height: 1.45; font-weight: 600">Locations</legend>
    <div style="background: #FFFFFF; border: 1px solid #D5DBE5; border-radius: 16px; padding: 0 16px">
      <label style="height: 56px; display: flex; align-items: center; gap: 12px; cursor: pointer">
        <input type="checkbox" checked style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">
        <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; background: #003399; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        <span style="flex-grow: 1; font-size: 16px">City Care Clinic, Salt Lake</span>
      </label>
      <label style="height: 56px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #E5E9F0; cursor: pointer">
        <input type="checkbox" style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">
        <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #D5DBE5"></span>
        <span style="flex-grow: 1; font-size: 16px">City Care — New Town</span>
      </label>
    </div>
  </fieldset>

  <!-- Permissions info -->
  <div style="background: #EBF1FB; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#003399" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; line-height: 1.45; font-weight: 600; color: #003399">Permissions come from the role</span>
      <span style="font-size: 14px; line-height: 1.45; color: #111827">Doctor: view, edit, prescribe, chat read + reply. There's no separate permission step.</span>
    </span>
  </div>

  <button type="submit" style="height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24); cursor: pointer">Add to team</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1304}}'>
class Component extends DCLogic {
  renderVals() {
    var active = 'Doctor';
    return {
      roles: ['Doctor', 'Front desk', "Doctor's assistant", 'Dietician', 'Lab manager', 'Lab technician', 'Practice manager'].map(function (label) {
        var on = label === active;
        return {
          label: label,
          checked: on ? 'true' : 'false',
          bg: on ? '#003399' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#545E72',
          border: on ? '1px solid #003399' : '1px solid #D5DBE5'
        };
      })
    };
  }
}
</script>
</body>
</html>
