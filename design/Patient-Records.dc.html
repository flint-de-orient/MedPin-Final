<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Health records</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 1920px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Health records</h1>
    <span style="font-size: 14px; color: #545E72">Prescriptions and test results from all your doctors</span>
  </div>
  <label style="position: relative; display: flex; align-items: center">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search records</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input type="search" placeholder="Search a test, medicine or doctor" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 16px 0 46px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; outline: none">
  </label>
  <div role="group" aria-label="Filter" style="display: flex; gap: 8px">
    <button aria-pressed="true" style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #003399; color: #FFFFFF; font-size: 14px; font-weight: 600">All · 6</button>
    <button aria-pressed="false" style="height: 40px; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 999px; background: #FFFFFF; color: #545E72; font-size: 14px; font-weight: 600">Prescriptions · 2</button>
    <button aria-pressed="false" style="height: 40px; padding: 0 14px; border: 1px solid #D5DBE5; border-radius: 999px; background: #FFFFFF; color: #545E72; font-size: 14px; font-weight: 600">Tests · 4</button>
  </div>
</header>

<main style="padding: 20px 20px 184px; display: flex; flex-direction: column; gap: 20px">
  <sc-for list="{{ months }}" as="m" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">{{ m.title }}</h2>
      <div style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 0 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column">
        <sc-for list="{{ m.items }}" as="r" hint-placeholder-count="2">
          <article style="padding: 16px 0; border-top: {{ r.border }}; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #545E72">{{ r.kind }}</span>
              <sc-if value="{{ r.flag }}" hint-placeholder-val="{{ false }}">
                <span style="height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; display: flex; align-items: center; background: {{ r.flagBg }}; color: {{ r.flagFg }}">{{ r.flag }}</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <h3 style="margin: 0; font-size: 17px; font-weight: 700">{{ r.title }}</h3>
              <span style="font-size: 13px; color: #545E72">{{ r.meta }}</span>
            </div>
            <p style="margin: 0; display: flex; gap: 8px; font-size: 14px; line-height: 1.5; color: #111827">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#003399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
              <span>{{ r.summary }}</span>
            </p>
            <div style="display: flex; gap: 8px; padding-top: 4px">
              <button style="flex-grow: 1; height: 44px; border: 0; border-radius: 12px; background: #EBF1FB; color: #003399; font-size: 14px; font-weight: 700">View</button>
              <button aria-label="Download {{ r.title }}" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #D5DBE5; border-radius: 12px; background: #FFFFFF; color: #003399; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"></path></svg>
              </button>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </sc-for>
</main>

<button style="position: absolute; right: 20px; bottom: 108px; height: 56px; padding: 0 20px 0 16px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(0,51,153,0.28)">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  Add record
</button>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 6px; background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Doctor</a>
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"></path><path d="m8.5 8.5 7 7"></path></svg>Medicines</a>
  <a href="#" aria-current="page" style="border-radius: 22px; background: #EBF1FB; color: #003399; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Records</a>
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    var HIGH = { bg: '#FEF6E7', fg: '#B45309' }, OK = { bg: '#E7F5EE', fg: '#076B3C' }, NEW = { bg: '#EBF1FB', fg: '#003399' };
    function r(kind, title, meta, summary, flag, tone) {
      return { kind: kind, title: title, meta: meta, summary: summary, flag: flag || '', flagBg: tone ? tone.bg : '', flagFg: tone ? tone.fg : '' };
    }
    function month(title, items) {
      items.forEach(function (x, i) { x.border = i === 0 ? '0' : '1px solid #E5E9F0'; });
      return { title: title, items: items };
    }
    return {
      months: [
        month('September 2026', [
          r('Prescription', 'Diabetes follow-up', '29 Sep · Dr. Arjun Sen', 'Glimepiride added to bring sugar down. Keep Metformin twice a day. HbA1c test before your next visit.', 'New', NEW)
        ]),
        month('August 2026', [
          r('Test result', 'ECG', '12 Aug · City Care', 'Your heart rhythm is normal.', 'Normal', OK)
        ]),
        month('July 2026', [
          r('Test result', 'Diabetes panel', '18 Jul · City Care lab', 'HbA1c 7.2%, slightly above your target of 7. Fasting sugar 138, also a little high.', '2 high', HIGH),
          r('Test result', 'Vitamin D', '18 Jul · uploaded by you', 'Vitamin D is low (14). Your doctor started a weekly supplement.', 'Low', HIGH)
        ]),
        month('March 2026', [
          r('Test result', 'Lipid profile', '12 Mar · SRL Diagnostics', 'Bad cholesterol (LDL 162) and triglycerides are high. Good cholesterol is normal.', '2 high', HIGH),
          r('Prescription', 'Sugar and cholesterol', '12 Mar · Dr. Arjun Sen', 'Metformin continued. Lipid test ordered after a high LDL reading.', '', null)
        ])
      ]
    };
  }
}
</script>
</body>
</html>
