<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export data</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 848px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #F7F9FC">
  <button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Export data</h1>
</header>

<form style="margin: 0; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 24px">

  <!-- Datasets -->
  <section role="group" aria-labelledby="sets-h" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column">
    <h2 id="sets-h" style="margin: 0; padding-bottom: 12px; font-size: 20px; line-height: 1.25; font-weight: 700">What to include</h2>
    <sc-for list="{{ sets }}" as="s" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #E5E9F0; cursor: pointer">
        <input type="checkbox" checked style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">
        <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; background: #003399; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; line-height: 1.5; font-weight: 600">{{ s.name }}</span>
          <span style="font-size: 14px; line-height: 1.45; color: #545E72">{{ s.detail }}</span>
        </span>
      </label>
    </sc-for>
  </section>

  <!-- Alerts date range -->
  <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
    <legend style="padding: 0 0 8px; font-size: 14px; line-height: 1.45; font-weight: 600">Alerts date range</legend>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
      <label style="position: relative; display: flex; align-items: center">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">From</span>
        <input type="text" value="1 Jul 2026" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 44px 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; font-variant-numeric: tabular-nums; outline: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; pointer-events: none"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      </label>
      <label style="position: relative; display: flex; align-items: center">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">To</span>
        <input type="text" value="29 Sep 2026" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 44px 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; font-variant-numeric: tabular-nums; outline: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; pointer-events: none"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      </label>
    </div>
  </fieldset>

  <!-- Format -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span id="fmt-l" style="font-size: 14px; line-height: 1.45; font-weight: 600">Format</span>
    <div role="radiogroup" aria-labelledby="fmt-l" style="background: #F1F4F9; border-radius: 16px; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
      <button type="button" role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); font-size: 15px; font-weight: 600; color: #111827; cursor: pointer">CSV</button>
      <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72; cursor: pointer">JSON</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <!-- Privacy warning -->
    <div role="note" style="background: #FEF6E7; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
      <span style="font-size: 14px; line-height: 1.45; color: #111827"><strong style="font-weight: 600; color: #B45309">This file will contain patient health information.</strong> Share it only through channels your clinic trusts.</span>
    </div>
    <p style="margin: 0; padding: 0 4px; font-size: 14px; line-height: 1.45; color: #545E72; font-variant-numeric: tabular-nums">Includes all 412 patients, not just the first page</p>
  </div>

  <button type="submit" style="height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"></path></svg>
    Export and share
  </button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sets: [
        { name: 'Patients', detail: 'Profiles and contact details' },
        { name: 'Clinical summary', detail: 'Conditions, medicines, latest readings' },
        { name: 'Alerts', detail: 'Raised within the date range below' }
      ]
    };
  }
}
</script>
</body>
</html>
