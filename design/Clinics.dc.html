<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; background: #F7F9FC; display: flex; align-items: center; gap: 4px">
  <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Locations</h1>
  <button aria-label="Add location" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #003399; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
</header>

<main style="padding: 8px 20px 32px; display: flex; flex-direction: column; gap: 16px">
  <p style="margin: 0; font-size: 14px; color: #545E72">City Care Clinic · 2 active, 1 inactive, 1 shared</p>

  <section aria-label="Locations" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 4px 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column">
    <sc-for list="{{ locations }}" as="l" hint-placeholder-count="4">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 16px 0; border-top: {{ l.divider }}; color: #111827">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 16px; font-weight: 600; color: {{ l.nameColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ l.name }}</span>
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
            <span style="flex-shrink: 0; height: 24px; padding: 0 10px; border-radius: 999px; background: {{ l.bg }}; color: {{ l.fg }}; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{ l.status }}</span>
            <span style="min-width: 0; font-size: 14px; color: #545E72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ l.days }}</span>
          </span>
          <span style="font-size: 13px; color: #69738A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ l.meta }}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </section>

  <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #69738A">Locations are never deleted. Deactivating one stops new bookings and keeps every patient's history.</p>

  <button style="margin-top: 8px; height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add location</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    var ACTIVE = { bg: '#E7F5EE', fg: '#076B3C' };
    var INACTIVE = { bg: '#F1F4F9', fg: '#545E72' };
    var SHARED = { bg: '#EBF1FB', fg: '#003399' };
    var rows = [
      ['City Care Clinic — Salt Lake', 'Active', ACTIVE, 'Mon–Sat · 15-min slots', 'DD-24, Sector 1, Salt Lake · 2 doctors'],
      ['City Care — New Town', 'Active', ACTIVE, 'Tue · Thu · Sat · 20-min slots', 'AA-II, Action Area 2, New Town · 1 doctor'],
      ['City Care — Behala', 'Inactive', INACTIVE, 'No new bookings', 'Deactivated 14 Aug 2026 · history kept'],
      ['Apollo Diagnostics desk', 'View only', SHARED, 'Shared lab desk', 'Managed by Apollo Diagnostics, not editable']
    ];
    return {
      locations: rows.map(function (r, i) {
        return { name: r[0], status: r[1], bg: r[2].bg, fg: r[2].fg, days: r[3], meta: r[4],
          nameColor: r[1] === 'Inactive' ? '#545E72' : '#111827',
          divider: i === 0 ? '0' : '1px solid #E5E9F0' };
      })
    };
  }
}
</script>
</body>
</html>
