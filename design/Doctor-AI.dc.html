<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="background: #FFFFFF; border-bottom: 1px solid #E5E9F0; height: 64px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
  <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">AI Assistant</h1>
  <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></svg>History
  </a>
</header>

<main style="padding: 28px 20px 140px; display: flex; flex-direction: column; gap: 28px; width: 354px; height: 961px">

  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
    <span style="width: 56px; height: 56px; border-radius: 18px; background: #003399; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,51,153,0.24)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
    </span>
    <h2 style="margin: 4px 0 0; font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">What do you need, Dr. Sen?</h2>
    <p style="margin: 0; max-width: 300px; font-size: 15px; line-height: 1.5; color: #545E72">Ask about any patient, appointment or prescription. Type, or tap the mic and speak.</p>
  </div>

  <section aria-labelledby="try-h" style="display: flex; flex-direction: column; gap: 12px">
    <h3 id="try-h" style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">Try asking</h3>
    <div style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); padding: 4px 0; display: flex; flex-direction: column">
      <sc-for list="{{ prompts }}" as="p" hint-placeholder-count="5">
        <button style="margin: 0 16px; padding: 14px 0; border: 0; border-top: {{ p.border }}; background: transparent; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 12px; font-weight: 700; color: #003399">{{ p.tag }}</span>
            <span style="font-size: 15px; line-height: 1.4; font-weight: 500; color: #111827">{{ p.q }}</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </button>
      </sc-for>
    </div>
  </section>

  <section aria-labelledby="rec-h" style="display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 4px; display: flex; align-items: center; justify-content: space-between">
      <h3 id="rec-h" style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">Recent</h3>
      <a href="#" style="font-size: 14px; font-weight: 600">See all</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ recent }}" as="r" hint-placeholder-count="3">
        <a href="#" style="padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E9F0; display: flex; align-items: center; gap: 12px; color: #111827">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.q }}</span>
            <span style="font-size: 13px; color: #69738A">{{ r.when }}</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </section>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: -22px; padding: 12px 16px 28px; background: #FFFFFF; border-top: 1px solid #E5E9F0; display: flex; flex-direction: column; gap: 10px; width: 357px; height: 117px">
  <div style="display: flex; align-items: center; gap: 8px">
    <label style="flex-grow: 1; height: 56px; box-sizing: border-box; padding: 0 8px 0 18px; border: 1px solid #D5DBE5; border-radius: 28px; background: #FFFFFF; display: flex; align-items: center; gap: 8px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask the AI Assistant</span>
      <input type="text" placeholder="Ask anything · type @ for a patient" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px">
      <button aria-label="Send" disabled="" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 999px; background: #F1F4F9; color: #69738A; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </label>
    <button aria-label="Speak your question" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; border-radius: 999px; background: #003399; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,51,153,0.24)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
  </div>
  <span style="text-align: center; font-size: 12px; color: #69738A">Answers come from your records. Check before acting — not a diagnosis.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var line = '1px solid #E5E9F0';
    return {
      prompts: [
        { tag: 'Patient', q: 'Summarise a patient — health score, abnormal results, medicines', border: '0' },
        { tag: 'Appointments', q: 'Who is next in today’s queue?', border: line },
        { tag: 'Test results', q: 'Which patients have abnormal results this week?', border: line },
        { tag: 'Prescriptions', q: 'Which prescriptions run out this week?', border: line },
        { tag: 'Insights', q: 'Which patients are missing their medicines?', border: line }
      ],
      recent: [
        { q: 'Compare a patient’s reports with their last visit', when: 'Today, 8:42 AM' },
        { q: 'Which follow-ups are due this week?', when: 'Yesterday' },
        { q: 'How many consultations did I do last week?', when: '28 Sep' }
      ]
    };
  }
}
</script>
</body>
</html>
