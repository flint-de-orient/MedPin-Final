<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patients · search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="background: #FFFFFF; border-bottom: 1px solid #E5E9F0; padding: 12px 12px 12px 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
  <button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <label style="flex-grow: 1; height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; border: 1.5px solid #003399; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 10px">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search patients</span>
    <input type="search" value="98765" inputmode="search" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums">
    <button aria-label="Clear search" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </label>
</header>

<main style="padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px">
  <span aria-live="polite" style="padding: 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">2 matches for “98765”</span>

  <div style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); padding: 0 16px; display: flex; flex-direction: column">
    <sc-for list="{{ results }}" as="r" hint-placeholder-count="2">
      <div style="padding: 16px 0; border-top: {{ r.border }}; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #EBF1FB; color: #003399; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ r.ini }}</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 700">{{ r.name }}</span>
            <span style="font-size: 14px; color: #545E72; font-variant-numeric: tabular-nums">+91 <mark style="background: #EBF1FB; color: #003399; font-weight: 700; border-radius: 4px; padding: 0 2px">98765</mark> {{ r.rest }}</span>
            <span style="font-size: 13px; color: #69738A">{{ r.meta }}</span>
          </span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
          <a href="#" style="height: 44px; border-radius: 12px; border: 1px solid #D5DBE5; background: #FFFFFF; color: #111827; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">View</a>
          <a href="#" style="height: 44px; border-radius: 12px; background: #EBF1FB; color: #003399; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Consult</a>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 18px; border-radius: 20px; border: 1px dashed #D5DBE5; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 700">Not the patient you’re looking for?</span>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Add them with this number and start a consultation straight away.</span>
    </span>
    <a href="#" style="align-self: flex-start; height: 44px; padding: 0 14px 0 12px; border-radius: 12px; background: #EBF1FB; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add new patient
    </a>
  </div>

  <section aria-labelledby="rs-h" style="display: flex; flex-direction: column; gap: 10px">
    <h2 id="rs-h" style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #69738A">Recent searches</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ recent }}" as="q" hint-placeholder-count="3">
        <button style="height: 36px; padding: 0 14px; border: 1px solid #D5DBE5; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 500">{{ q }}</button>
      </sc-for>
    </div>
  </section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      results: [
        { name: 'Priya Sharma', ini: 'PS', rest: '43210', meta: '29 F · Type 2 diabetes · seen today', border: '0' },
        { name: 'Sneha Ghosh', ini: 'SG', rest: '07731', meta: '47 F · Hypertension · seen 12 Jun', border: '1px solid #E5E9F0' }
      ],
      recent: ['Amit Pal', 'Moumita', '97480 62215']
    };
  }
}
</script>
</body>
</html>
