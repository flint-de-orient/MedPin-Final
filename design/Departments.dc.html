<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Departments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 888px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #F7F9FC">
  <button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Departments</h1>
</header>

<main style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 16px">

  <!-- This practice (editable) -->
  <section aria-labelledby="own-h" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px">
      <h2 id="own-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">This practice</h2>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Specialties City Care Clinic has added</span>
    </div>
    <sc-for list="{{ own }}" as="d" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #E5E9F0">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; line-height: 1.5; font-weight: 600">{{ d.name }}</span>
          <span style="font-size: 14px; line-height: 1.45; color: #545E72; font-variant-numeric: tabular-nums">{{ d.usage }}</span>
        </span>
        <button aria-label="{{ d.editLabel }}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #003399; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </button>
      </div>
    </sc-for>
    <button style="margin-top: 16px; height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: #EBF1FB; color: #003399; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add department
    </button>
  </section>

  <!-- Shared specialties (read-only) -->
  <section aria-labelledby="shared-h" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px">
      <h2 id="shared-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Shared specialties</h2>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Defined by MedPin for every practice</span>
    </div>
    <sc-for list="{{ shared }}" as="s" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #E5E9F0">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; line-height: 1.5; font-weight: 600">{{ s.name }}</span>
          <span style="font-size: 14px; line-height: 1.45; color: {{ s.usageColor }}; font-variant-numeric: tabular-nums">{{ s.usage }}</span>
        </span>
        <span aria-label="Read-only" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #69738A">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </span>
      </div>
    </sc-for>
    <p style="margin: 0; padding-top: 14px; border-top: 1px solid #E5E9F0; font-size: 14px; line-height: 1.45; color: #545E72">Shared specialties are set by MedPin for all clinics, so they can't be edited here.</p>
  </section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":888}}'>
class Component extends DCLogic {
  renderVals() {
    function panels(n) { return n === 1 ? 'Used by 1 dashboard panel' : 'Used by ' + n + ' dashboard panels'; }
    return {
      own: [['Endocrinology', 3], ['Diabetology', 2]].map(function (r) {
        return { name: r[0], usage: panels(r[1]), editLabel: 'Edit ' + r[0] };
      }),
      shared: [['Cardiology', 4], ['General medicine', 2], ['Gynaecology', 1], ['Nephrology', 0]].map(function (r) {
        return { name: r[0], usage: r[1] === 0 ? 'Not used' : panels(r[1]), usageColor: r[1] === 0 ? '#69738A' : '#545E72' };
      })
    };
  }
}
</script>
</body>
</html>
