<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a meal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #545E72">Good morning,</span><span style="font-size: 28px; font-weight: 800">Priya</span></div>
<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="lg-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>
  <div style="display: flex; align-items: center; gap: 8px">
    <h2 id="lg-h" style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Add to your log</h2>
    <button aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div role="tablist" aria-label="Log type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; background: #F1F4F9; border-radius: 16px">
    <button role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.08); font-size: 15px; font-weight: 600; color: #111827">Meal</button>
    <button role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72">Exercise</button>
    <button role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72">Steps</button>
  </div>

  <div role="group" aria-label="Which meal" style="display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{ meals }}" as="m" hint-placeholder-count="4">
      <button aria-pressed="{{ m.on }}" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{ m.bg }}; color: {{ m.fg }}; border: {{ m.border }}">{{ m.label }}</button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px">
    <button aria-label="Add a photo of your meal" style="width: 88px; height: 96px; flex-shrink: 0; border: 1.5px dashed #D5DBE5; border-radius: 16px; background: #F7F9FC; color: #003399; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      Photo
    </button>
    <div style="position: relative; flex-grow: 1">
      <label for="meal" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">What did you eat?</label>
      <textarea id="meal" placeholder="What did you eat? E.g. 2 rotis, dal, salad" style="width: 100%; height: 96px; box-sizing: border-box; padding: 12px 52px 12px 14px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 15px; line-height: 1.45; resize: none; outline: none"></textarea>
      <button aria-label="Speak instead" style="position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border: 0; border-radius: 12px; background: #EBF1FB; color: #003399; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column">
    <span style="font-size: 14px; font-weight: 600; padding-bottom: 4px">Share with</span>
    <sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: {{ p.border }}; cursor: pointer">
        <input type="checkbox" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: {{ p.boxBg }}; border: {{ p.boxBorder }}">
          <sc-if value="{{ p.on }}" hint-placeholder-val="{{ false }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </sc-if>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600">{{ p.name }}</span>
          <span style="font-size: 13px; color: #545E72">{{ p.role }}</span>
        </span>
      </label>
    </sc-for>
  </div>

  <button style="height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24)">Save lunch</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function chip(label, on) { return { label: label, on: on, bg: on ? '#003399' : '#FFFFFF', fg: on ? '#FFFFFF' : '#545E72', border: on ? '1px solid #003399' : '1px solid #D5DBE5' }; }
    return {
      meals: [chip('Breakfast', false), chip('Lunch', true), chip('Snack', false), chip('Dinner', false)],
      people: [
        { name: 'Mou Banerjee', role: 'Dietician · reviews every 3 days', on: true },
        { name: 'Dr. Arjun Sen', role: 'Diabetes', on: true },
        { name: 'Dr. Rina Mitra', role: 'Heart', on: false }
      ].map(function (p, i) { p.border = i === 0 ? '0' : '1px solid #E5E9F0'; p.boxBg = p.on ? '#003399' : '#FFFFFF'; p.boxBorder = p.on ? '0' : '1.5px solid #D5DBE5'; return p; })
    };
  }
}
</script>
</body>
</html>
