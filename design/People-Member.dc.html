<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team member</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #F7F9FC">
  <button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; margin-right: 8px; border-radius: 999px; background: #EBF1FB; color: #003399; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">RS</span>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
    <h1 style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Rohit Saha</h1>
    <span style="font-size: 14px; line-height: 1.45; color: #545E72; font-variant-numeric: tabular-nums">+91 98311 20486 · Joined Mar 2026</span>
  </div>
</header>

<main style="flex-grow: 1; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="m-role" style="font-size: 14px; line-height: 1.45; font-weight: 600">Role</label>
    <div style="position: relative; display: flex; align-items: center">
      <select id="m-role" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 48px 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; appearance: none; -webkit-appearance: none; outline: none">
        <option>Doctor</option>
        <option>Front desk</option>
        <option selected>Doctor's assistant</option>
        <option>Dietician</option>
        <option>Lab manager</option>
        <option>Lab technician</option>
        <option>Practice manager</option>
      </select>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="m-dept" style="font-size: 14px; line-height: 1.45; font-weight: 600">Department</label>
    <div style="position: relative; display: flex; align-items: center">
      <select id="m-dept" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 48px 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; appearance: none; -webkit-appearance: none; outline: none">
        <option selected>Endocrinology</option>
        <option>Diabetology</option>
        <option>Cardiology</option>
        <option>General medicine</option>
      </select>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span id="m-loc-l" style="font-size: 14px; line-height: 1.45; font-weight: 600">Locations</span>
    <button type="button" aria-labelledby="m-loc-l m-loc-v" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
      <span id="m-loc-v" style="flex-grow: 1; font-size: 16px">City Care Clinic, Salt Lake</span>
      <span style="font-size: 14px; color: #69738A; font-variant-numeric: tabular-nums">1 of 2</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>

  <!-- Read-only permissions from the role preset -->
  <section aria-labelledby="can-h" style="margin-top: 8px; background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h2 id="can-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">What this role can do</h2>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Set by the Doctor's assistant role</span>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
      <sc-for list="{{ perms }}" as="p" hint-placeholder-count="4">
        <li style="height: 36px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: {{ p.color }}">
          <sc-if value="{{ p.allowed }}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#076B3C" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 6 9 17l-5-5"></path></svg>
          </sc-if>
          <sc-if value="{{ p.denied }}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </sc-if>
          <span>{{ p.label }}</span>
        </li>
      </sc-for>
    </ul>
  </section>

  <!-- Suspend -->
  <div style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 16px 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; align-items: center; gap: 16px">
    <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span id="susp-l" style="font-size: 16px; line-height: 1.5; font-weight: 600">Suspend access</span>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Suspended members lose access immediately.</span>
    </span>
    <button role="switch" aria-checked="false" aria-labelledby="susp-l" style="width: 52px; height: 32px; flex-shrink: 0; box-sizing: border-box; padding: 2px; border: 0; border-radius: 999px; background: #D5DBE5; display: flex; align-items: center; cursor: pointer">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04)"></span>
    </button>
  </div>
</main>

<div style="padding: 16px 20px 24px; flex-shrink: 0">
  <button style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24); cursor: pointer">Save</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      perms: [
        ['View patients', true],
        ['Edit records', true],
        ['Read and reply to chats', true],
        ['Prescribe', false]
      ].map(function (r) {
        return { label: r[0], allowed: r[1], denied: !r[1], color: r[1] ? '#111827' : '#69738A' };
      })
    };
  }
}
</script>
</body>
</html>
