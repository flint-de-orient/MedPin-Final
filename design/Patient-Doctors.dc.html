<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My doctors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 4px">
  <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">My doctors</h1>
  <span style="font-size: 14px; color: #545E72">3 doctors caring for you</span>
</header>

<main style="padding: 20px 20px 112px; display: flex; flex-direction: column; gap: 12px">

  <sc-for list="{{ doctors }}" as="d" hint-placeholder-count="3">
    <article style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: {{ d.shadow }}; display: flex; flex-direction: column; gap: 16px">
      <a href="#" style="display: flex; align-items: center; gap: 14px; color: #111827">
        <span style="position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 999px; background: #EBF1FB; color: #003399; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ d.initials }}
          <span style="position: absolute; right: 1px; bottom: 1px; width: 12px; height: 12px; border-radius: 999px; border: 2px solid #FFFFFF; background: {{ d.dot }}"></span>
        </span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 700">{{ d.name }}</span>
          <span style="font-size: 14px; color: #545E72">{{ d.dept }}</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #F7F9FC">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
          <span style="flex-grow: 1; color: #111827; font-weight: {{ d.visitWeight }}">{{ d.visit }}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"></path><path d="m8.5 8.5 7 7"></path></svg>
          <span style="flex-grow: 1; color: #111827">{{ d.meds }}</span>
        </span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="#" style="position: relative; height: 48px; border-radius: 12px; background: #003399; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Chat
          <sc-if value="{{ d.unread }}" hint-placeholder-val="{{ false }}">
            <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #003399; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ d.unread }}</span>
          </sc-if>
        </a>
        <a href="#" style="height: 48px; border-radius: 12px; border: 1px solid #D5DBE5; background: #FFFFFF; color: #111827; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ d.second }}</a>
      </div>
    </article>
  </sc-for>

  <a href="#" style="margin-top: 4px; padding: 16px 20px; border-radius: 20px; border: 1.5px dashed #D5DBE5; display: flex; align-items: center; gap: 14px; color: #111827">
    <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #EBF1FB; color: #003399; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 700">Find a new doctor</span>
      <span style="font-size: 13px; color: #545E72">Describe your symptoms and we'll suggest the right specialist</span>
    </span>
  </a>
</main>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 6px; background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
  <a href="#" aria-current="page" style="position: relative; border-radius: 22px; background: #EBF1FB; color: #003399; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Doctor
    <span aria-label="2 unread" style="position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #003399; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">2</span></a>
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"></path><path d="m8.5 8.5 7 7"></path></svg>Medicines</a>
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Records</a>
  <a href="#" style="border-radius: 22px; color: #545E72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    var RAISED = '0 8px 24px rgba(0,51,153,0.10)', REST = '0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04)';
    return {
      doctors: [
        { initials: 'AS', name: 'Dr. Arjun Sen', dept: 'Diabetes · City Care, Salt Lake', dot: '#076B3C', visit: 'Visit today, 5:00 PM · Token 04', visitWeight: '700', meds: '3 medicines · 82% taken', unread: '2', second: 'Visit details', shadow: RAISED },
        { initials: 'RM', name: 'Dr. Rina Mitra', dept: 'Heart · City Care, Salt Lake', dot: '#B45309', visit: 'No visit booked · last seen 02 Feb', visitWeight: '400', meds: '1 medicine · 91% taken', unread: '', second: 'Book a visit', shadow: REST },
        { initials: 'NG', name: 'Dr. Nandita Gupta', dept: 'Gynaecology · Apollo Clinic', dot: '#D5DBE5', visit: 'Follow-up due in November', visitWeight: '400', meds: '1 medicine · not tracked', unread: '', second: 'Book a visit', shadow: REST }
      ]
    };
  }
}
</script>
</body>
</html>
