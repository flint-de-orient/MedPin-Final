<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add patient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
input::placeholder,textarea::placeholder{color:#69738A}
</style>
</helmet>
<div style="width: 390px; height: 1232px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; background: #F7F9FC; display: flex; align-items: center; gap: 4px">
  <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #111827; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  </button>
  <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 1.25; font-weight: 700">Add patient</h1>
</header>

<form style="margin: 0; padding: 8px 20px 32px; display: flex; flex-direction: column; gap: 16px">

  <!-- Required -->
  <section aria-labelledby="req-h" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h2 id="req-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Patient details</h2>
      <span style="font-size: 14px; color: #545E72">Required to register the patient</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="name" style="font-size: 14px; font-weight: 600">Full name</label>
      <input id="name" type="text" value="Farhana Islam" autocomplete="name" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="age" style="font-size: 14px; font-weight: 600">Age</label>
      <div style="width: 144px; height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 8px">
        <input id="age" type="text" inputmode="numeric" value="34" style="flex-grow: 1; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 16px; outline: none; font-variant-numeric: tabular-nums">
        <span style="font-size: 14px; color: #69738A">years</span>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 14px; font-weight: 600">Gender</legend>
      <div role="radiogroup" aria-label="Gender" style="padding: 4px; border-radius: 16px; background: #F1F4F9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <button type="button" role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); font-size: 15px; font-weight: 600; color: #111827; cursor: pointer">Female</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72; cursor: pointer">Male</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 500; color: #545E72; cursor: pointer">Other</button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="phone" style="font-size: 14px; font-weight: 600">Phone number</label>
      <div style="height: 56px; box-sizing: border-box; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; overflow: hidden">
        <span style="height: 100%; padding: 0 12px 0 16px; border-right: 1px solid #E5E9F0; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: #545E72">+91</span>
        <input id="phone" type="tel" value="98301 22457" aria-describedby="phone-help" style="flex-grow: 1; min-width: 0; border: 0; padding: 0 12px; background: transparent; font-size: 16px; outline: none; font-variant-numeric: tabular-nums">
        <span style="flex-shrink: 0; padding-right: 16px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #076B3C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Verified</span>
      </div>
      <span id="phone-help" style="font-size: 13px; color: #69738A">OTP confirmed. The patient's app will use this number.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="addr" style="font-size: 14px; font-weight: 600">Address</label>
      <textarea id="addr" rows="2" style="height: 80px; box-sizing: border-box; padding: 14px 16px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; font-size: 16px; line-height: 1.5; resize: none">14/2 Beliaghata Main Road, Kolkata 700010</textarea>
    </div>
  </section>

  <!-- Optional: Vitals (expanded) -->
  <section aria-labelledby="vit-h" style="background: #FFFFFF; border: 1px solid #E5E9F0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; flex-direction: column; gap: 16px">
    <button type="button" aria-expanded="true" aria-controls="vit-body" style="margin: -4px 0; min-height: 48px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span id="vit-h" style="font-size: 20px; line-height: 1.25; font-weight: 700; color: #111827">Vitals</span>
        <span style="font-size: 14px; color: #545E72">Optional · the doctor sees these before the visit</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; transform: rotate(180deg)"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div id="vit-body" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px">
      <sc-for list="{{ vitals }}" as="v" hint-placeholder-count="4">
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
          <label for="{{ v.id }}" style="font-size: 14px; font-weight: 600">{{ v.label }}</label>
          <div style="height: 56px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 6px">
            <input id="{{ v.id }}" type="text" inputmode="numeric" value="{{ v.value }}" style="flex-grow: 1; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 16px; outline: none; font-variant-numeric: tabular-nums">
            <span style="flex-shrink: 0; font-size: 13px; color: #69738A">{{ v.unit }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- Optional: Complaints (collapsed) -->
  <button type="button" aria-expanded="false" style="min-height: 72px; box-sizing: border-box; padding: 12px 20px; border: 1px solid #E5E9F0; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,51,153,0.05), 0 1px 3px rgba(0,51,153,0.04); display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 20px; line-height: 1.25; font-weight: 700; color: #111827">Complaints</span>
      <span style="font-size: 14px; color: #545E72">Optional · what brings them in today</span>
    </span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545E72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg>
  </button>

  <button type="submit" style="margin-top: 8px; height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24); cursor: pointer">Add patient</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1232}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      vitals: [
        { id: 'bp', label: 'Blood pressure', value: '128/84', unit: 'mmHg' },
        { id: 'pulse', label: 'Pulse', value: '78', unit: 'bpm' },
        { id: 'weight', label: 'Weight', value: '62', unit: 'kg' },
        { id: 'sugar', label: 'Fasting sugar', value: '112', unit: 'mg/dL' }
      ]
    };
  }
}
</script>
</body>
</html>
