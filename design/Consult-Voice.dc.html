<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Consultation · add medicine by voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="display: flex; flex-direction: column">
  <div style="background: #FFFFFF; border-bottom: 1px solid #E5E9F0; height: 64px; padding: 0 16px; display: flex; align-items: center; font-size: 20px; font-weight: 700">Consultation</div>
  <div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="height: 120px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E5E9F0"></div>
    <div style="height: 220px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E5E9F0"></div>
  </div>
</div>

<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="v-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 20px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h2 id="v-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Add medicine by voice</h2>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #003399">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #003399"></span>Listening
    </span>
  </div>

  <p aria-live="polite" style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; color: #111827">“Glimepiride one mg, once in the morning before breakfast, <span style="color: #69738A">for thirty days”</span></p>

  <div aria-hidden="true" style="height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="24">
      <span style="width: 4px; border-radius: 999px; background: {{ b.color }}; height: {{ b.h }}"></span>
    </sc-for>
  </div>

  <div style="border: 1px solid #E5E9F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #076B3C">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      Understood as
    </span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
      <sc-for list="{{ parsed }}" as="p" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #545E72">{{ p.label }}</span>
          <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{ p.value }}</span>
        </div>
      </sc-for>
    </div>
    <p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #FEF6E7; display: flex; gap: 8px; font-size: 13px; line-height: 1.45; color: #111827">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
      Sulfonylurea. Priya has a sulfa drug allergy.
    </p>
  </div>

  <p style="margin: 0; font-size: 13px; color: #69738A">Try: “Atorvastatin 20 at night for 3 months”</p>

  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
    <button style="height: 56px; border: 1px solid #D5DBE5; border-radius: 16px; background: #FFFFFF; color: #111827; font-size: 16px; font-weight: 600">Say again</button>
    <button style="height: 56px; border: 0; border-radius: 16px; background: #003399; color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,51,153,0.24)">Add medicine</button>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var hs = [8, 14, 22, 30, 18, 26, 36, 24, 16, 28, 38, 30, 20, 12, 24, 32, 18, 10, 14, 8, 6, 6, 6, 6];
    return {
      bars: hs.map(function (h, i) { return { h: h + 'px', color: i < 18 ? '#003399' : '#D5DBE5' }; }),
      parsed: [
        { label: 'Medicine', value: 'Glimepiride 1 mg' },
        { label: 'When', value: '1-0-0' },
        { label: 'Food', value: 'Before breakfast' },
        { label: 'Duration', value: '30 days' }
      ]
    };
  }
}
</script>
</body>
</html>
