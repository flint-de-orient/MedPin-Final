<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emergency · choose doctor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#111827;background:#F7F9FC;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#003399;text-decoration:none}a:hover{color:#002470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #111827; position: relative">

<div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #545E72">Good morning,</span><span style="font-size: 28px; font-weight: 800">Priya</span></div>
<div style="position: absolute; inset: 0; background: rgba(17,24,39,0.40)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="em-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-shadow: 0 8px 24px rgba(0,51,153,0.10); display: flex; flex-direction: column; gap: 18px">
  <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5DBE5"></span>
  <div style="display: flex; align-items: flex-start; gap: 8px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
      <h2 id="em-h" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">Which doctor do you need?</h2>
      <span style="font-size: 14px; line-height: 1.45; color: #545E72">Your message is marked urgent and the doctor is alerted right away.</span>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; border-radius: 12px; background: transparent; color: #545E72; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column">
    <sc-for list="{{ doctors }}" as="d" hint-placeholder-count="3">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: {{ d.border }}; color: #111827">
        <span style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; background: #EBF1FB; color: #003399; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ d.initials }}
          <span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 999px; border: 2px solid #FFFFFF; background: {{ d.dot }}"></span>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{ d.name }}</span>
          <span style="font-size: 13px; color: #545E72">{{ d.dept }}</span>
          <span style="font-size: 13px; font-weight: 600; color: {{ d.statusColor }}">{{ d.status }}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69738A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>

  <p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #FDECEC; font-size: 14px; line-height: 1.45; color: #111827"><strong style="color: #B91C1C">Chest pain, trouble breathing or fainting?</strong> Don't wait for a reply. <a href="tel:108" style="font-weight: 700; color: #B91C1C">Call 108</a></p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      doctors: [
        { initials: 'AS', name: 'Dr. Arjun Sen', dept: 'Diabetes · City Care', status: 'Available now', statusColor: '#076B3C', dot: '#076B3C' },
        { initials: 'RM', name: 'Dr. Rina Mitra', dept: 'Heart · City Care', status: 'In clinic · usually replies in 15 min', statusColor: '#545E72', dot: '#B45309' },
        { initials: 'NG', name: 'Dr. Nandita Gupta', dept: 'Gynaecology · Apollo Clinic', status: 'Away · her clinic team will see it', statusColor: '#545E72', dot: '#D5DBE5' }
      ].map(function (d, i) { d.border = i === 0 ? '0' : '1px solid #E5E9F0'; return d; })
    };
  }
}
</script>
</body>
</html>
