name: medpin_app
description: "MedPin — Care Connected. Doctor, front desk and patient apps."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  http_parser: ^4.1.2
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  share_plus: ^13.3.1
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  record: ^6.2.1
  just_audio: ^0.10.6
  geolocator: ^14.1.1
  health: ^13.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  smart_auth: ^3.2.0
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  shaders:
    - shaders/mark_reveal.frag
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800

# App icon from the MedPin mark: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F7F9FC"
    theme_color: "#003399"
